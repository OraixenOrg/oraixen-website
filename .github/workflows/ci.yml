name: CI

# Validation only — this workflow never deploys and never publishes anything.
on:
  push:
    branches:
      - Dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only: the workflow only checks out code and runs local npm scripts.
permissions:
  contents: read

# Supersede an in-flight run when a newer commit lands on the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
